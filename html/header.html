<!-- Header de navegacion -->
<header
    class="fixed top-0 left-0 w-full z-50 transition-all duration-300 border-b border-white/5 bg-[#0a0a0a]/80 backdrop-blur-md">
    <div class="container mx-auto px-6 py-4">
        <div class="flex justify-between items-center">

            <!-- Left Side: Nav Menu -->
            <nav class="hidden md:block">
                <ul class="flex justify-start space-x-10" data-nav-list="desktop"></ul>
            </nav>

            <!-- Left Side Mobile: Hamburger Button -->
            <button class="md:hidden text-gray-300 hover:text-white focus:outline-none transition-colors"
                id="mobileMenuButton" type="button" aria-controls="mobileMenu" aria-expanded="false">
                <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
                        d="M4 6h16M4 12h16M4 18h16" />
                </svg>
            </button>

            <!-- Right Side: Logo -->
            <a href="#" id="headerLogo" class="flex items-center gap-2 group cursor-pointer" aria-label="Ir al inicio">
                <h1
                    class="text-2xl font-black text-white tracking-wider uppercase transition-transform duration-300 group-hover:scale-105">
                    NILVER<span class="text-[#E50914]"> T.I</span>
                </h1>
            </a>
        </div>
    </div>

    <!-- Mobile Menu -->
    <div class="md:hidden hidden bg-[#0a0a0a]/95 backdrop-blur-md border-t border-white/5 py-6 px-6" id="mobileMenu">
        <ul class="flex flex-col items-start space-y-6" data-nav-list="mobile"></ul>
    </div>
</header>
