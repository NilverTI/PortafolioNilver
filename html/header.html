<!-- Header de navegacion -->
<header class="site-header" id="siteHeader">
    <div class="site-header__inner">

        <!-- Logo -->
        <a href="#" id="headerLogo" class="site-header__logo" aria-label="Ir al inicio">
            NILVER<span class="site-header__logo-accent"> T.I</span>
        </a>

        <!-- Desktop Nav -->
        <nav class="site-header__nav" aria-label="Navegación principal">
            <ul class="site-header__nav-list" data-nav-list="desktop">{{desktopNav}}</ul>
        </nav>

        <!-- Hamburger (Mobile) -->
        <button
            class="site-header__hamburger"
            id="mobileMenuButton"
            type="button"
            aria-controls="mobileMenu"
            aria-expanded="false"
            aria-label="Abrir menú">
            <span class="site-header__bar"></span>
            <span class="site-header__bar"></span>
            <span class="site-header__bar"></span>
        </button>

    </div>

    <!-- Mobile Menu -->
    <div class="site-header__mobile hidden" id="mobileMenu">
        <ul class="site-header__mobile-list" data-nav-list="mobile">{{mobileNav}}</ul>
    </div>
</header>
