<!-- Header de navegacion -->
<header class="fixed w-full bg-[#0F0F11] bg-opacity-95 z-50 transition-all duration-300">
    <div class="container mx-auto px-6 py-5">
        <div class="flex justify-between items-center">
            <h1 class="text-3xl font-bold text-[#E50914] tracking-tighter">NT</h1>
            
            <nav class="hidden md:block flex-1">
                <ul class="flex justify-center space-x-8" data-nav-list="desktop"></ul>
            </nav>
            
            <div class="hidden md:block">
                <a href="#contact" class="bg-[#E50914] hover:bg-red-600 text-white px-6 py-2 rounded-full font-medium text-sm transition duration-300 shadow-[0_0_15px_rgba(229,9,20,0.5)]">
                    Let's Talk
                </a>
            </div>

            <button class="md:hidden text-white focus:outline-none" id="mobileMenuButton" type="button"
                aria-controls="mobileMenu" aria-expanded="false">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M4 6h16M4 12h16M4 18h16" />
                </svg>
            </button>
        </div>
    </div>
    <div class="md:hidden hidden bg-[#0F0F11] border-t border-[#1E1E24] py-4" id="mobileMenu">
        <ul class="flex flex-col items-center space-y-4" data-nav-list="mobile"></ul>
        <div class="mt-6 flex justify-center">
            <a href="#contact" class="bg-[#E50914] text-white px-6 py-2 rounded-full font-medium text-sm">
                Let's Talk
            </a>
        </div>
    </div>
</header>
