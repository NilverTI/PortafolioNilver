<!-- Seccion de Proyectos -->
<section id="projects" class="proj-section">
    <div class="proj-bg-glow"></div>

    <div class="proj-container">

        <!-- Header -->
        <div class="section-header">
            <span class="section-label" data-i18n="projectsSection.label">What I have built</span>
            <h2 class="section-title">
                <span data-i18n="projectsSection.titlePrefix">My</span>
                <span class="section-title__accent" data-i18n="projectsSection.titleAccent">Projects</span>
            </h2>
            <p class="section-subtitle" data-i18n="projectsSection.subtitle">
                Real websites, in production, built with modern technologies.
            </p>
        </div>

        <!-- Projects grid -->
        <div id="projectsGrid" class="proj-grid"></div>

        <!-- Pagination -->
        <div class="proj-pagination" id="projPagination">
            <button class="proj-page-btn" id="projPrevBtn" aria-label="Previous page"
                data-i18n-aria-label="projectsSection.previousPage">
                <i class="fa-solid fa-chevron-left"></i>
            </button>
            <div class="proj-page-dots" id="projPageDots"></div>
            <button class="proj-page-btn" id="projNextBtn" aria-label="Next page"
                data-i18n-aria-label="projectsSection.nextPage">
                <i class="fa-solid fa-chevron-right"></i>
            </button>
        </div>

    </div>
</section>
