<!-- Seccion de Habilidades -->
<section id="skills" class="skills-section">
    <div class="skills-bg-glow"></div>

    <div class="skills-container">

        <!-- Section Header -->
        <div class="section-header">
            <span class="section-label" data-i18n="skillsSection.label">What can I do?</span>
            <h2 class="section-title">
                <span data-i18n="skillsSection.titlePrefix">My</span>
                <span class="section-title__accent" data-i18n="skillsSection.titleAccent">Skills</span>
            </h2>
            <p class="section-subtitle" data-i18n="skillsSection.subtitle">
                Technologies I use to build modern, scalable, high-impact products.
            </p>
        </div>

        <!-- Skills Grid (rendered by JS, 6 per page) -->
        <div id="skillsCategoryGrid" class="sk-grid">{{skillsGrid}}</div>

        <!-- Pagination controls (rendered by JS) -->
        <div id="skillsPagination">{{skillsPagination}}</div>

    </div>
</section>
