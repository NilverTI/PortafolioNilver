<!-- Generated file. Run `node scripts/build.js` after editing files in `html/`, `css/`, `js/` or `config/`. -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{metaTitle}}</title>
    <meta name="description" content="{{metaDescription}}" />
    <meta name="robots" content="index,follow,max-image-preview:large" />
    <meta name="theme-color" content="{{themeColor}}" />
    <meta name="author" content="Nilver TI" />
    <meta name="keywords" content="Nilver TI, Frontend Developer, Web Developer, Portfolio, React, JavaScript, HTML, CSS, TypeScript, Node.js, Desarrollador Web" />

    <!-- Canonical -->
    <link rel="canonical" href="{{siteUrl}}" />

    <!-- Favicons & App Icons -->
    <link rel="icon" type="image/x-icon" href="/img/favicons/favicon.ico" />
    <link rel="icon" type="image/png" sizes="16x16" href="/img/favicons/favicon-16x16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/img/favicons/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/img/favicons/favicon-48x48.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/img/favicons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="{{metaLocale}}" />
    <meta property="og:title" content="{{metaTitle}}" />
    <meta property="og:description" content="{{metaDescription}}" />
    <meta property="og:url" content="{{siteUrl}}" />
    <meta property="og:image" content="{{previewImageUrl}}" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:site_name" content="Nilver TI - Portfolio" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@nilverti" />
    <meta name="twitter:title" content="{{metaTitle}}" />
    <meta name="twitter:description" content="{{metaDescription}}" />
    <meta name="twitter:image" content="{{previewImageUrl}}" />

    <!-- Preload critical resources -->
    <link rel="preload" href="fonts/poppins-300.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="fonts/poppins-600.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="img/ico/logo.png" as="image" type="image/png" fetchpriority="high" />

    <!-- Styles -->
{{styles}}

    <!-- JSON-LD Schema -->
    <script type="application/ld+json">{{structuredData}}</script>
</head>
<body>
{{headerMarkup}}
    <main>
{{mainMarkup}}
    </main>
{{footerMarkup}}

    <div class="custom-scrollbar" id="customScrollbar" aria-hidden="true">
        <div class="custom-scrollbar__track" id="customScrollbarTrack">
            <div class="custom-scrollbar__labels" id="customScrollbarLabels"></div>
            <div class="custom-scrollbar__thumb" id="customScrollbarThumb"></div>
        </div>
    </div>
    <script type="module" src="{{entryScript}}"></script>
</body>
</html>
